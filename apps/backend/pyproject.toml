[project]
name = "backend"
version = "0.1.0"
description = "Backend service"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.104.0",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "libsql>=0.1.11",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uuid6>=2025.0.1",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
